name: Docker and Sonar CI pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sonarqube:
    runs-on: [self-hosted, wsl-ubuntu]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Sonarqube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.projectKey=NodeApp
            -Dsonar.sources=.
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    runs-on: [self-hosted, wsl-ubuntu]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker inage
        run: docker build -f Dockerfile.multistage.distroless -t dockerfile-distroless .

      - name: Tag and Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile-distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:$SHORT_SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:$SHORT_SHA
