name: Docker CI

on: 
  workflow_dispatch:

jobs:
  docker:
    runs-on: [self-hosted, wsl-ubuntu]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker inage
        run: docker build -f Dockerfile.multistage.distroless -t dockerfile-distroless .

      - name: Tag and Push Docker Image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile-distroless ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:$SHORT_SHA
          docker push ${{ vars.DOCKERHUB_USERNAME }}/nodeapp5:$SHORT_SHA

        
