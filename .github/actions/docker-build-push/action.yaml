name: Docker  Build and Push

inputs:
  username:
    description: Docker Hub username
    required: true
  password:
    description: Docker Hub password
    required: true

runs:
  using: "composite"

  steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ inputs.username }}
          password: ${{ inputs.password }}

      - name: Build Docker inage
        shell: bash
        run: docker build -f Dockerfile.multistage.distroless -t dockerfile-distroless .

      - name: Tag and Push Docker Image
        shell: bash
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker tag dockerfile-distroless ${{ inputs.username }}/nodeapp5:$SHORT_SHA
          docker push ${{ inputs.username }}/nodeapp5:$SHORT_SHA
